name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: unit tests
        run: go test ./... -count=1

  docs:
    name: docs and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive ./examples

      - name: validate the generated docs
        run: go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.23.0 validate --provider-name hosttracker

      - name: the docs must be regenerated with the schema
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.23.0 generate --provider-name hosttracker
          if [ -n "$(git status --porcelain docs)" ]; then
            echo "docs/ is out of date: run 'make docs' and commit the result"
            git --no-pager diff docs
            exit 1
          fi
